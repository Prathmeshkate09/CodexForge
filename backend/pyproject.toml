[project]
name = "codexforge-api"
version = "0.1.0"
description = "Approval-first API for CodexForge."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.109,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0.36,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1.0",
  "black>=25.1,<26.0",
  "mypy>=1.15,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/backend"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"../tests/backend/**/*.py" = ["S101"]
"tests/backend/**/*.py" = ["S101"]
"**/tests/backend/**/*.py" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "pytest-cache-files-.*"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
