name: codexforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codexforge}
      POSTGRES_USER: ${POSTGRES_USER:-codexforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codexforge}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      CODEXFORGE_ENVIRONMENT: development
      CODEXFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codexforge}:${POSTGRES_PASSWORD:-codexforge}@postgres:5432/${POSTGRES_DB:-codexforge}
      CODEXFORGE_REDIS_URL: redis://redis:6379/0
      CODEXFORGE_JWT_SECRET: ${CODEXFORGE_JWT_SECRET:?Copy .env.example to .env and set CODEXFORGE_JWT_SECRET before starting CodexForge.}
      CODEXFORGE_ALLOW_DEV_IDENTITY: ${CODEXFORGE_ALLOW_DEV_IDENTITY:-false}
      CODEXFORGE_DEV_IDENTITY_SECRET: ${CODEXFORGE_DEV_IDENTITY_SECRET:-}
      # Optional Firebase RS256 validation for the local container flow. Leave
      # these at their defaults to retain the local development-token workflow.
      CODEXFORGE_JWT_ISSUER: ${CODEXFORGE_JWT_ISSUER:-codexforge}
      CODEXFORGE_JWT_AUDIENCE: ${CODEXFORGE_JWT_AUDIENCE:-codexforge-api}
      CODEXFORGE_JWT_JWKS_URL: ${CODEXFORGE_JWT_JWKS_URL:-}
      CODEXFORGE_OPENAI_API_KEY: ${CODEXFORGE_OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # The only production-bundle path permitted to use a relative API URL.
        # Nginx proxies this exact route to the backend service.
        VITE_API_TRANSPORT_MODE: local-container-proxy
        VITE_API_BASE_URL: /api/v1
        # Firebase web configuration is public client configuration. It is
        # intentionally build-time only and must never include server secrets.
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
