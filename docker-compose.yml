name: codexforge

# Shared definitions keep the API and one-time migration job on the exact same
# image and private service configuration.
x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile

x-backend-environment: &backend-environment
  CODEXFORGE_ENVIRONMENT: development
  CODEXFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codexforge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-codexforge}
  CODEXFORGE_REDIS_URL: redis://redis:6379/0
  CODEXFORGE_JWT_SECRET: ${CODEXFORGE_JWT_SECRET:?Set CODEXFORGE_JWT_SECRET in .env}
  CODEXFORGE_ALLOW_DEV_IDENTITY: ${CODEXFORGE_ALLOW_DEV_IDENTITY:-false}
  CODEXFORGE_DEV_IDENTITY_SECRET: ${CODEXFORGE_DEV_IDENTITY_SECRET:-}
  CODEXFORGE_JWT_ISSUER: ${CODEXFORGE_JWT_ISSUER:-codexforge}
  CODEXFORGE_JWT_AUDIENCE: ${CODEXFORGE_JWT_AUDIENCE:-codexforge-api}
  CODEXFORGE_JWT_JWKS_URL: ${CODEXFORGE_JWT_JWKS_URL:-}
  CODEXFORGE_OPENAI_API_KEY: ${CODEXFORGE_OPENAI_API_KEY:-}
  CODEXFORGE_GITHUB_WEBHOOK_SECRET: ${CODEXFORGE_GITHUB_WEBHOOK_SECRET:-}
  CODEXFORGE_GITHUB_APP_ID: ${CODEXFORGE_GITHUB_APP_ID:-}
  CODEXFORGE_GITHUB_PRIVATE_KEY: ${CODEXFORGE_GITHUB_PRIVATE_KEY:-}
  CODEXFORGE_GITHUB_PRIVATE_KEY_PATH: ${CODEXFORGE_GITHUB_PRIVATE_KEY_PATH:-}

services:
  postgres:
    container_name: codexforge-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codexforge}
      POSTGRES_USER: ${POSTGRES_USER:-codexforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - codexforge_postgres_data:/var/lib/postgresql/data
    networks:
      - codexforge_network

  redis:
    container_name: codexforge-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - codexforge_redis_data:/data
    networks:
      - codexforge_network

  migrate:
    container_name: codexforge-migrate
    image: codexforge-backend:local
    build: *backend-build
    restart: "no"
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codexforge_network

  backend:
    container_name: codexforge-backend
    image: codexforge-backend:local
    build: *backend-build
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "127.0.0.1:${CODEXFORGE_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - codexforge_network

  frontend:
    container_name: codexforge-frontend
    image: codexforge-frontend:local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Docker Compose is the only production bundle permitted to use the
        # same-origin Nginx proxy. Firebase Hosting remains HTTPS-direct.
        VITE_API_TRANSPORT_MODE: local-container-proxy
        VITE_API_BASE_URL: /api/v1
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEXFORGE_WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codexforge_network

volumes:
  codexforge_postgres_data:
    name: codexforge-postgres-data
  codexforge_redis_data:
    name: codexforge-redis-data

networks:
  codexforge_network:
    name: codexforge-network
    driver: bridge
