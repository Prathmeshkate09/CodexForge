# Session-facing operating configuration. AGENTS.md is the authoritative repository rule set.

[project]
name = "CodexForge"
stage = "local_workflow_foundation"
primary_docs = [
  "AGENTS.md",
  "docs/architecture/system-architecture.md",
  "docs/architecture/security-model.md",
  "docs/features/approval-first-workflow.md",
  "docs/api/api-overview.md",
]

[workflow]
require_plan_before_nontrivial_change = true
require_explicit_approval_for_repository_write = true
require_explicit_approval_for_pull_request = true
update_change_log_for_meaningful_changes = true

[safety]
never_execute_model_generated_shell = true
redact_untrusted_repository_content = true
secrets_server_side_only = true
allow_automatic_merge = false
allow_automatic_production_deploy = false
